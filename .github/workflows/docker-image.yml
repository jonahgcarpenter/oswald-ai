name: Docker Build and Push on Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Only owner may publish releases
        run: |
          if [ "${{ github.actor }}" != "jonahgcarpenter" ]; then
            echo "Release publisher '${{ github.actor }}' is not authorized; only jonahgcarpenter may publish. Drafts are allowed."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev

      - name: Run tests
        run: go test -tags sqlite_fts5 ./...

  build-and-push:
    needs: [test, authorize]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta_server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}/oswald-ai

      - name: Build and push docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}

  revert-unauthorized:
    needs: authorize
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Revert unauthorized publish back to draft
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            if (context.actor === 'jonahgcarpenter') {
              core.info('Authorized publisher, nothing to revert.');
              return;
            }
            const releaseId = context.payload.release?.id;
            if (!releaseId) {
              core.setFailed('No release id in context; cannot revert.');
              return;
            }
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: releaseId,
              draft: true,
            });
            core.setFailed(`Unauthorized publisher ${context.actor}; release reverted to draft.`);

  release-notes:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
